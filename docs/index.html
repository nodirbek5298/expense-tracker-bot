<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Xarajatlar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg1:#06120c;--bg2:#0b2a1b;--card:rgba(255,255,255,.07);--gb:rgba(255,255,255,.14);--gs:0 8px 32px rgba(0,0,0,.35);--inp:rgba(255,255,255,.07);--line:rgba(255,255,255,.12);--g:#22c55e;--g2:#4ade80;--tx:#e8f5ec;--mut:#8fb09c;--bad:#f87171;--orb:.55}
:root.light{--bg1:#e8f7ee;--bg2:#c9ecd8;--card:rgba(255,255,255,.62);--gb:rgba(255,255,255,.95);--gs:0 8px 28px rgba(22,101,52,.14);--inp:rgba(255,255,255,.7);--line:rgba(22,101,52,.16);--g2:#15803d;--tx:#0b2415;--mut:#4f6f5c;--bad:#dc2626;--orb:.35}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font:400 15px/1.45 'Poppins',system-ui,-apple-system,sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;color:var(--tx);min-height:100vh;padding:16px 16px 40px;transition:color .3s}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(70px);opacity:var(--orb);pointer-events:none}
body::before{width:260px;height:260px;background:#22c55e;top:-70px;right:-90px}
body::after{width:300px;height:300px;background:#0ea5a4;bottom:-110px;left:-110px}
section{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
@keyframes grow{from{transform:scaleY(0)}}
.card,.kpi,.tabs,.seg,.ic,#toast{background:var(--card);border:1px solid var(--gb);box-shadow:var(--gs);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%)}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:22px;font-weight:600}.muted{color:var(--mut);font-size:13px}
.ic{border-radius:50%;width:42px;height:42px;font-size:18px;color:var(--tx)}
.tabs,.seg{display:flex;gap:6px;padding:5px;border-radius:20px;margin-bottom:14px}
button{font:inherit;cursor:pointer;transition:transform .1s,background .2s}
button:active{transform:scale(.96)}
.tab,.sg{flex:1;border:0;border-radius:15px;background:none;color:var(--mut);font-weight:500}
.sg{padding:10px 4px;font-size:14px}
.tab{padding:7px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px}
.tab span{font-size:18px}
.tab.on,.sg.on{background:linear-gradient(135deg,#22c55e,#4ade80);color:#032010;font-weight:600;box-shadow:0 4px 14px rgba(34,197,94,.35)}
.card{border-radius:24px;padding:18px;margin-bottom:14px}
label{display:block;color:var(--mut);font-size:12px;font-weight:500;margin-bottom:8px}
.amt{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);padding-bottom:6px}
.amt:focus-within{border-color:var(--g)}
#amount{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:34px;font-weight:600}
.amt span{color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--gb);background:var(--inp);color:var(--tx);border-radius:999px;padding:8px 14px;font-size:14px}
.chip.on{background:linear-gradient(135deg,#22c55e,#4ade80);border-color:transparent;color:#032010;font-weight:600;box-shadow:0 4px 14px rgba(34,197,94,.3)}
input.t{width:100%;margin-top:12px;background:var(--inp);border:1px solid var(--gb);border-radius:14px;padding:11px 14px;color:var(--tx);font:inherit;outline:0}
input.t:focus{border-color:var(--g)}
.go{width:100%;border:0;border-radius:18px;padding:15px;background:linear-gradient(135deg,#22c55e,#4ade80);color:#032010;font-size:16px;font-weight:600;box-shadow:0 8px 24px rgba(34,197,94,.38)}
.go.inc{background:linear-gradient(135deg,#facc15,#fde68a);box-shadow:0 8px 24px rgba(250,204,21,.32)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{border-radius:20px;padding:14px}
.kpi b{display:block;font-size:18px;font-weight:600;margin-top:4px;color:var(--g2)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:6px;transition:width .8s ease,background .3s}
.lim{display:flex;gap:8px}.lim input{margin-top:12px;flex:1;min-width:0}
.mini{margin-top:12px;border:0;border-radius:14px;padding:10px 16px;background:linear-gradient(135deg,#22c55e,#4ade80);color:#032010;font-weight:600}
.mini.off{background:var(--line);color:var(--tx)}
.donut{display:block;width:200px;height:200px;margin:4px auto 12px}
.donut text{fill:var(--tx);text-anchor:middle;font-family:'Poppins',sans-serif}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.dot{width:12px;height:12px;border-radius:50%}
.nm{flex:1;text-transform:capitalize}.nm small{display:block;color:var(--mut);font-size:12px;text-transform:none}
.pc{color:var(--mut);font-size:13px}
.ar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700}
.ar.income{background:#facc1533;color:#facc15}.ar.expense{background:#f8717133;color:var(--bad)}
b.income{color:#ca8a04}.x{border:0;background:none;color:var(--mut);font-size:16px;padding:4px 8px}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px}
.bc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.bv{width:100%;border-radius:8px 8px 0 0;background:linear-gradient(var(--g2),var(--g));transform-origin:bottom;animation:grow .7s ease both;min-height:3px}
#toast{position:fixed;left:16px;right:16px;bottom:24px;border-radius:16px;padding:12px;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s}
#toast.show{opacity:1}
</style>
</head>
<body>
<header><div><h1>💸 Xarajatlar</h1><div class="muted">Talabalar va oilalar uchun</div></div><button id="theme" class="ic">☀️</button></header>
<div class="tabs">
  <button class="tab on" data-v="add"><span>➕</span>Qo'shish</button>
  <button class="tab" data-v="stats"><span>📊</span>Statistika</button>
  <button class="tab" data-v="hist"><span>🧾</span>Tarix</button>
  <button class="tab" data-v="more"><span>⚙️</span>Ko'proq</button>
</div>

<section id="v-add">
  <div class="seg"><button class="sg on" data-k="expense">Xarajat</button><button class="sg" data-k="income">Kirim</button></div>
  <div class="card">
    <label for="amount">Summa</label>
    <div class="amt"><input id="amount" inputmode="numeric" placeholder="0" autocomplete="off"><span>so'm</span></div>
  </div>
  <div class="card">
    <label>Kategoriya</label>
    <div id="chips" class="chips"></div>
    <input id="custom" class="t" maxlength="50" placeholder="Yoki o'zingiz yozing...">
  </div>
  <button id="add" class="go">Xarajatni qo'shish</button>
</section>

<section id="v-stats" hidden>
  <div class="kpis">
    <div class="kpi"><span class="muted">Bugun xarajat</span><b id="today">0</b></div>
    <div class="kpi"><span class="muted"><span id="month">Shu oy</span> xarajat</span><b id="exp">0</b></div>
    <div class="kpi"><span class="muted">Oy kirimi</span><b id="inc">0</b></div>
    <div class="kpi"><span class="muted">Oy balansi</span><b id="bal">0</b></div>
  </div>
  <div class="card">
    <label>Oylik limit</label>
    <div class="bar"><i id="bud"></i></div>
    <div class="muted" id="budt" style="margin-top:8px"></div>
    <div class="lim"><input id="limit" class="t" inputmode="numeric" placeholder="Limit (so'm), 0 = o'chirish"><button id="setlim" class="mini">Saqlash</button></div>
  </div>
  <div class="card">
    <svg class="donut" viewBox="0 0 42 42">
      <circle r="15.9155" cx="21" cy="21" fill="none" style="stroke:var(--line)" stroke-width="5"/>
      <g id="donut"></g>
      <text id="ctr" x="21" y="21.5" font-size="4.4" font-weight="600"></text>
      <text x="21" y="26.5" font-size="2.6" style="fill:var(--mut)">so'm</text>
    </svg>
    <div id="list"></div>
  </div>
  <div class="card"><label>Oxirgi 7 kun xarajati</label><div id="bars" class="bars"></div></div>
</section>

<section id="v-hist" hidden>
  <div class="card"><div id="hist"></div></div>
  <p class="muted" style="text-align:center">Oxirgi 8 ta yozuv. Yangilash uchun botga /app yozing.</p>
</section>

<section id="v-more" hidden>
  <div class="card"><label>📅 Oylik hisobot</label><div id="rep"></div></div>
  <div class="card">
    <label>📤 Excel (CSV) yuklab olish</label>
    <div class="lim"><button class="mini" data-ex="1" style="flex:1">Shu oy</button><button class="mini" data-ex="0" style="flex:1">Hammasi</button></div>
    <div class="muted" style="margin-top:8px">Fayl bot chatiga yuboriladi.</div>
  </div>
  <div class="card">
    <label>⏰ Kunlik eslatma</label>
    <div class="lim"><input id="rt" class="t" type="time"><button id="rsave" class="mini">Saqlash</button><button id="roff" class="mini off">O'chirish</button></div>
    <div class="muted" id="rst" style="margin-top:8px"></div>
  </div>
  <div class="card">
    <label>🔁 Doimiy xarajatlar (har oy avtomatik)</label>
    <div id="rec"></div>
    <input id="ra" class="t" inputmode="numeric" placeholder="Summa">
    <input id="rc" class="t" maxlength="50" placeholder="Kategoriya (ijara, internet...)">
    <div class="lim"><input id="rd" class="t" inputmode="numeric" placeholder="Oyning kuni (1-28)"><button id="radd" class="mini">Qo'shish</button></div>
  </div>
</section>
<div id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits = v => parseInt(String(v).replace(/\D/g, '') || '0', 10);
const COLORS = ['#22c55e','#4ade80','#16a34a','#86efac','#15803d','#34d399','#bbf7d0','#14532d'];
const CATS = {
  expense: [['🍽','ovqat'],['🚕','transport'],['👕','kiyim'],['📚',"o'qish"],['🏠','kommunal'],['💊','salomatlik'],['🎮',"ko'ngilochar"],['📦','boshqa']],
  income: [['💼','maosh'],['🎓','stipendiya'],['🎁',"sovg'a"],['📦','boshqa']]
};
let kind = 'expense', sel = 'ovqat', toastTimer;

function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2500); }
function send(o) {
  if (tg && tg.sendData && tg.platform && tg.platform !== 'unknown') tg.sendData(JSON.stringify(o));
  else toast('Saqlash uchun ilovani Telegram ichida oching.');
}
function ask(m, cb) { if (tg && tg.showConfirm && tg.platform !== 'unknown') tg.showConfirm(m, ok => ok && cb()); else if (confirm(m)) cb(); }

function applyTheme(light) {
  document.documentElement.classList.toggle('light', light);
  $('#theme').textContent = light ? '🌙' : '☀️';
  const c = light ? '#e8f7ee' : '#06120c';
  if (tg) { try { tg.setHeaderColor(c); tg.setBackgroundColor(c); } catch (e) {} }
  try { localStorage.setItem('theme', light ? 'l' : 'd'); } catch (e) {}
}
function readStats() {
  try {
    const p = new URLSearchParams(location.search).get('s');
    if (!p) return {};
    const b = p.replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(b + '='.repeat((4 - b.length % 4) % 4));
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
  } catch (e) { return {}; }
}

function renderChips() {
  $('#chips').innerHTML = CATS[kind].map(([i, n]) =>
    `<button class="chip${n === sel ? ' on' : ''}" data-n="${esc(n)}">${i} ${esc(n)}</button>`).join('');
  const inc = kind === 'income';
  $('#add').textContent = inc ? "Kirimni qo'shish" : "Xarajatni qo'shish";
  $('#add').classList.toggle('inc', inc);
}

function renderStats(s) {
  const rows = s.m || [], sum = rows.reduce((a, r) => a + r[1], 0), n = s.n || 0, b = s.b || 0;
  if (s.mn) $('#month').textContent = s.mn;
  $('#today').textContent = fmt(s.t || 0);
  $('#exp').textContent = fmt(n);
  $('#inc').textContent = fmt(s.i || 0);
  const bal = (s.i || 0) - n;
  $('#bal').textContent = (bal < 0 ? '−' : '') + fmt(Math.abs(bal));
  $('#bal').style.color = bal < 0 ? 'var(--bad)' : '';
  const pct = b ? n / b * 100 : 0;
  $('#bud').style.width = Math.min(100, pct) + '%';
  $('#bud').style.background = pct >= 100 ? 'var(--bad)' : pct >= 80 ? '#facc15' : 'var(--g)';
  $('#budt').textContent = b ? `${fmt(n)} / ${fmt(b)} so'm (${Math.round(pct)}%)` : 'Limit belgilanmagan';
  $('#ctr').textContent = fmt(sum);
  if (!sum) {
    $('#donut').innerHTML = '';
    $('#list').innerHTML = '<p class="muted">Bu oy hali xarajat yo\'q.</p>';
  } else {
    let off = 0;
    $('#donut').innerHTML = rows.map(([c, v], i) => {
      const p = v / sum * 100;
      const el = `<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${COLORS[i % 8]}" stroke-width="5" stroke-dasharray="${p} ${100 - p}" stroke-dashoffset="${25 - off}"/>`;
      off += p; return el;
    }).join('');
    $('#list').innerHTML = rows.map(([c, v], i) =>
      `<div class="row"><span class="dot" style="background:${COLORS[i % 8]}"></span><span class="nm">${esc(c)}</span><span class="pc">${Math.round(v / sum * 100)}%</span><b>${fmt(v)}</b></div>`).join('');
  }
  const d = s.d && s.d.length === 7 ? s.d : [0,0,0,0,0,0,0], mx = Math.max(...d, 1);
  const days = ['Ya','Du','Se','Ch','Pa','Ju','Sh'];
  $('#bars').innerHTML = d.map((v, i) => {
    const day = new Date(Date.now() - (6 - i) * 864e5).getDay();
    return `<div class="bc"><div class="bv" style="height:${v / mx * 85}%" title="${fmt(v)}"></div>${days[day]}</div>`;
  }).join('');
}

function renderHist(h) {
  $('#hist').innerHTML = h.length ? h.map(([id, k, a, c, d]) =>
    `<div class="row"><span class="ar ${k}">${k === 'income' ? '↓' : '↑'}</span><span class="nm">${esc(c)}<small>${esc(d)} · #${id}</small></span><b class="${k}">${k === 'income' ? '+' : '−'}${fmt(a)}</b><button class="x" data-id="${id}">✕</button></div>`).join('')
    : '<p class="muted">Hali yozuv yo\'q.</p>';
}

function renderMore(s) {
  const n = s.n || 0, i = s.i || 0, p = s.p || 0, bal = i - n;
  const L = [['Kirim', fmt(i)], ['Xarajat', fmt(n)], ['Balans', (bal < 0 ? '−' : '') + fmt(Math.abs(bal))], ["Kuniga o'rtacha", fmt(n / new Date().getDate())]];
  if (p) L.push(["O'tgan oyga nisbatan", (n >= p ? '+' : '−') + Math.round(Math.abs(n - p) / p * 100) + '%']);
  $('#rep').innerHTML = L.map(([a, b]) => `<div class="row"><span class="nm">${a}</span><b>${b}</b></div>`).join('');
  $('#rt').value = s.r || '';
  $('#rst').textContent = s.r ? `Har kuni ${s.r} da (o'sha kuni yozuv bo'lmasa)` : "Eslatma o'chiq";
  const c = s.c || [];
  $('#rec').innerHTML = c.length ? c.map(([id, a, k, d]) =>
    `<div class="row"><span class="nm">${esc(k)}<small>har oyning ${d}-kuni</small></span><b>${fmt(a)}</b><button class="x" data-rid="${id}">✕</button></div>`).join('')
    : '<p class="muted">Doimiy xarajat yo\'q.</p>';
}

$('#chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  sel = b.dataset.n; $('#custom').value = ''; renderChips();
});
$$('.sg').forEach(b => b.addEventListener('click', () => {
  kind = b.dataset.k; sel = CATS[kind][0][1];
  $$('.sg').forEach(x => x.classList.toggle('on', x === b)); renderChips();
}));
['#amount', '#limit', '#ra'].forEach(id => $(id).addEventListener('input', e => {
  const d = e.target.value.replace(/\D/g, '').slice(0, 12);
  e.target.value = d ? fmt(+d) : '';
}));
$('#add').addEventListener('click', () => {
  const amount = digits($('#amount').value);
  if (!amount) { $('#amount').focus(); return; }
  send({ a: 'add', k: kind, amount, category: ($('#custom').value.trim() || sel).slice(0, 50) });
});
$('#setlim').addEventListener('click', () => send({ a: 'budget', amount: digits($('#limit').value) }));
$('#hist').addEventListener('click', e => {
  const b = e.target.closest('.x'); if (!b) return;
  ask("Yozuv o'chirilsinmi?", () => send({ a: 'del', id: +b.dataset.id }));
});
$('#v-more').addEventListener('click', e => {
  const ex = e.target.closest('[data-ex]');
  if (ex) return send({ a: 'export', m: +ex.dataset.ex });
  const x = e.target.closest('[data-rid]');
  if (x) return ask("Doimiy xarajat o'chirilsinmi?", () => send({ a: 'rec_del', id: +x.dataset.rid }));
  if (e.target.id === 'rsave') { const t = $('#rt').value; return t ? send({ a: 'remind', t }) : toast('Vaqtni tanlang.'); }
  if (e.target.id === 'roff') return send({ a: 'remind', t: '' });
  if (e.target.id === 'radd') {
    const amount = digits($('#ra').value), day = digits($('#rd').value);
    if (!amount || day < 1 || day > 28) return toast('Summa va kun (1-28) kiriting.');
    send({ a: 'rec_add', amount, category: $('#rc').value.trim() || 'boshqa', day });
  }
});
$$('.tab').forEach(t => t.addEventListener('click', () => {
  $$('.tab').forEach(x => x.classList.toggle('on', x === t));
  ['add', 'stats', 'hist', 'more'].forEach(v => $('#v-' + v).hidden = v !== t.dataset.v);
}));
$('#theme').addEventListener('click', () => applyTheme(!document.documentElement.classList.contains('light')));

if (tg) { tg.ready(); tg.expand(); }
let light = false; try { light = localStorage.getItem('theme') === 'l'; } catch (e) {}
applyTheme(light);
const S = readStats();
renderChips(); renderStats(S); renderHist(S.h || []); renderMore(S);
</script>
</body>
</html>
