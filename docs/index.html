<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Xarajatlar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#07130e;--card:#0e2219;--line:#1a3a2b;--g:#22c55e;--g2:#4ade80;--tx:#e8f5ec;--mut:#7fa38d;--bad:#f87171}
:root.light{--bg:#f0f8f2;--card:#fff;--line:#d3e7da;--g2:#15803d;--tx:#0b2415;--mut:#5b7a67;--bad:#dc2626}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font:16px/1.4 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding:16px 16px 40px;transition:background .3s,color .3s}
section{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
@keyframes grow{from{transform:scaleY(0)}}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:22px}.muted{color:var(--mut);font-size:14px}
.ic{border:1px solid var(--line);background:var(--card);border-radius:50%;width:40px;height:40px;font-size:18px;color:var(--tx)}
.tabs,.seg{display:flex;gap:6px;background:var(--card);padding:4px;border-radius:14px;margin-bottom:14px}
button{font:inherit;cursor:pointer;transition:transform .1s,background .2s}
button:active{transform:scale(.96)}
.tab,.sg{flex:1;border:0;border-radius:11px;padding:10px 4px;background:none;color:var(--mut);font-weight:600;font-size:15px}
.tab.on,.sg.on{background:var(--g);color:#032010}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
label{display:block;color:var(--mut);font-size:13px;margin-bottom:8px}
.amt{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);padding-bottom:6px}
.amt:focus-within{border-color:var(--g)}
#amount{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font-size:34px;font-weight:700}
.amt span{color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:999px;padding:8px 14px;font-size:15px}
.chip.on{background:var(--g);border-color:var(--g);color:#032010;font-weight:600}
input.t{width:100%;margin-top:12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--tx);font:inherit;outline:0}
input.t:focus{border-color:var(--g)}
.go{width:100%;border:0;border-radius:14px;padding:15px;background:var(--g);color:#032010;font-size:17px;font-weight:700}
.go.inc{background:#facc15}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi b{display:block;font-size:19px;margin-top:4px;color:var(--g2)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:6px;transition:width .8s ease,background .3s}
.lim{display:flex;gap:8px}.lim input{margin-top:12px;flex:1}
.mini{margin-top:12px;border:0;border-radius:12px;padding:0 16px;background:var(--g);color:#032010;font-weight:700}
.donut{display:block;width:200px;height:200px;margin:4px auto 12px}
.donut text{fill:var(--tx);text-anchor:middle}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.dot{width:12px;height:12px;border-radius:50%}
.nm{flex:1;text-transform:capitalize}.nm small{display:block;color:var(--mut);font-size:12px;text-transform:none}
.pc{color:var(--mut);font-size:14px}
.ar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700}
.ar.income{background:#facc1533;color:#facc15}.ar.expense{background:#f8717133;color:var(--bad)}
b.income{color:#ca8a04}.x{border:0;background:none;color:var(--mut);font-size:16px;padding:4px 8px}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px}
.bc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.bv{width:100%;border-radius:6px 6px 0 0;background:linear-gradient(var(--g2),var(--g));transform-origin:bottom;animation:grow .7s ease both;min-height:3px}
#toast{position:fixed;left:16px;right:16px;bottom:24px;background:var(--card);border:1px solid var(--g);border-radius:12px;padding:12px;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s}
#toast.show{opacity:1}
</style>
</head>
<body>
<header><div><h1>💸 Xarajatlar</h1><div class="muted">Talabalar va oilalar uchun</div></div><button id="theme" class="ic">☀️</button></header>
<div class="tabs">
  <button class="tab on" data-v="add">➕ Qo'shish</button>
  <button class="tab" data-v="stats">📊 Statistika</button>
  <button class="tab" data-v="hist">🧾 Tarix</button>
</div>

<section id="v-add">
  <div class="seg"><button class="sg on" data-k="expense">Xarajat</button><button class="sg" data-k="income">Kirim</button></div>
  <div class="card">
    <label for="amount">Summa</label>
    <div class="amt"><input id="amount" inputmode="numeric" placeholder="0" autocomplete="off"><span>so'm</span></div>
  </div>
  <div class="card">
    <label>Kategoriya</label>
    <div id="chips" class="chips"></div>
    <input id="custom" class="t" maxlength="50" placeholder="Yoki o'zingiz yozing...">
  </div>
  <button id="add" class="go">Xarajatni qo'shish</button>
</section>

<section id="v-stats" hidden>
  <div class="kpis">
    <div class="kpi"><span class="muted">Bugun xarajat</span><b id="today">0</b></div>
    <div class="kpi"><span class="muted"><span id="month">Shu oy</span> xarajat</span><b id="exp">0</b></div>
    <div class="kpi"><span class="muted">Oy kirimi</span><b id="inc">0</b></div>
    <div class="kpi"><span class="muted">Oy balansi</span><b id="bal">0</b></div>
  </div>
  <div class="card">
    <label>Oylik limit</label>
    <div class="bar"><i id="bud"></i></div>
    <div class="muted" id="budt" style="margin-top:8px"></div>
    <div class="lim"><input id="limit" class="t" inputmode="numeric" placeholder="Limit (so'm), 0 = o'chirish"><button id="setlim" class="mini">Saqlash</button></div>
  </div>
  <div class="card">
    <svg class="donut" viewBox="0 0 42 42">
      <circle r="15.9155" cx="21" cy="21" fill="none" style="stroke:var(--line)" stroke-width="5"/>
      <g id="donut"></g>
      <text id="ctr" x="21" y="21.5" font-size="4.4" font-weight="700"></text>
      <text x="21" y="26.5" font-size="2.6" style="fill:var(--mut)">so'm</text>
    </svg>
    <div id="list"></div>
  </div>
  <div class="card"><label>Oxirgi 7 kun xarajati</label><div id="bars" class="bars"></div></div>
</section>

<section id="v-hist" hidden>
  <div class="card"><div id="hist"></div></div>
  <p class="muted" style="text-align:center">Oxirgi 8 ta yozuv. Yangilash uchun botga /app yozing.</p>
</section>
<div id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits = v => parseInt(String(v).replace(/\D/g, '') || '0', 10);
const COLORS = ['#22c55e','#4ade80','#16a34a','#86efac','#15803d','#34d399','#bbf7d0','#14532d'];
const CATS = {
  expense: [['🍽','ovqat'],['🚕','transport'],['👕','kiyim'],['📚',"o'qish"],['🏠','kommunal'],['💊','salomatlik'],['🎮',"ko'ngilochar"],['📦','boshqa']],
  income: [['💼','maosh'],['🎓','stipendiya'],['🎁',"sovg'a"],['📦','boshqa']]
};
let kind = 'expense', sel = 'ovqat', toastTimer;

function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2500); }
function send(o) {
  if (tg && tg.sendData && tg.platform && tg.platform !== 'unknown') tg.sendData(JSON.stringify(o));
  else toast('Saqlash uchun ilovani Telegram ichida oching.');
}
function ask(m, cb) { if (tg && tg.showConfirm && tg.platform !== 'unknown') tg.showConfirm(m, ok => ok && cb()); else if (confirm(m)) cb(); }

function applyTheme(light) {
  document.documentElement.classList.toggle('light', light);
  $('#theme').textContent = light ? '🌙' : '☀️';
  const c = light ? '#f0f8f2' : '#07130e';
  if (tg) { try { tg.setHeaderColor(c); tg.setBackgroundColor(c); } catch (e) {} }
  try { localStorage.setItem('theme', light ? 'l' : 'd'); } catch (e) {}
}
function readStats() {
  try {
    const p = new URLSearchParams(location.search).get('s');
    if (!p) return {};
    const b = p.replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(b + '='.repeat((4 - b.length % 4) % 4));
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
  } catch (e) { return {}; }
}

function renderChips() {
  $('#chips').innerHTML = CATS[kind].map(([i, n]) =>
    `<button class="chip${n === sel ? ' on' : ''}" data-n="${esc(n)}">${i} ${esc(n)}</button>`).join('');
  const inc = kind === 'income';
  $('#add').textContent = inc ? "Kirimni qo'shish" : "Xarajatni qo'shish";
  $('#add').classList.toggle('inc', inc);
}

function renderStats(s) {
  const rows = s.m || [], sum = rows.reduce((a, r) => a + r[1], 0), n = s.n || 0, b = s.b || 0;
  if (s.mn) $('#month').textContent = s.mn;
  $('#today').textContent = fmt(s.t || 0);
  $('#exp').textContent = fmt(n);
  $('#inc').textContent = fmt(s.i || 0);
  const bal = (s.i || 0) - n;
  $('#bal').textContent = (bal < 0 ? '−' : '') + fmt(Math.abs(bal));
  $('#bal').style.color = bal < 0 ? 'var(--bad)' : '';
  const pct = b ? n / b * 100 : 0;
  $('#bud').style.width = Math.min(100, pct) + '%';
  $('#bud').style.background = pct >= 100 ? 'var(--bad)' : pct >= 80 ? '#facc15' : 'var(--g)';
  $('#budt').textContent = b ? `${fmt(n)} / ${fmt(b)} so'm (${Math.round(pct)}%)` : 'Limit belgilanmagan';
  $('#ctr').textContent = fmt(sum);
  if (!sum) {
    $('#donut').innerHTML = '';
    $('#list').innerHTML = '<p class="muted">Bu oy hali xarajat yo\'q.</p>';
  } else {
    let off = 0;
    $('#donut').innerHTML = rows.map(([c, v], i) => {
      const p = v / sum * 100;
      const el = `<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${COLORS[i % 8]}" stroke-width="5" stroke-dasharray="${p} ${100 - p}" stroke-dashoffset="${25 - off}"/>`;
      off += p; return el;
    }).join('');
    $('#list').innerHTML = rows.map(([c, v], i) =>
      `<div class="row"><span class="dot" style="background:${COLORS[i % 8]}"></span><span class="nm">${esc(c)}</span><span class="pc">${Math.round(v / sum * 100)}%</span><b>${fmt(v)}</b></div>`).join('');
  }
  const d = s.d && s.d.length === 7 ? s.d : [0,0,0,0,0,0,0], mx = Math.max(...d, 1);
  const days = ['Ya','Du','Se','Ch','Pa','Ju','Sh'];
  $('#bars').innerHTML = d.map((v, i) => {
    const day = new Date(Date.now() - (6 - i) * 864e5).getDay();
    return `<div class="bc"><div class="bv" style="height:${v / mx * 85}%" title="${fmt(v)}"></div>${days[day]}</div>`;
  }).join('');
}

function renderHist(h) {
  $('#hist').innerHTML = h.length ? h.map(([id, k, a, c, d]) =>
    `<div class="row"><span class="ar ${k}">${k === 'income' ? '↓' : '↑'}</span><span class="nm">${esc(c)}<small>${esc(d)} · #${id}</small></span><b class="${k}">${k === 'income' ? '+' : '−'}${fmt(a)}</b><button class="x" data-id="${id}">✕</button></div>`).join('')
    : '<p class="muted">Hali yozuv yo\'q.</p>';
}

$('#chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  sel = b.dataset.n; $('#custom').value = ''; renderChips();
});
$$('.sg').forEach(b => b.addEventListener('click', () => {
  kind = b.dataset.k; sel = CATS[kind][0][1];
  $$('.sg').forEach(x => x.classList.toggle('on', x === b)); renderChips();
}));
['#amount', '#limit'].forEach(id => $(id).addEventListener('input', e => {
  const d = e.target.value.replace(/\D/g, '').slice(0, 12);
  e.target.value = d ? fmt(+d) : '';
}));
$('#add').addEventListener('click', () => {
  const amount = digits($('#amount').value);
  if (!amount) { $('#amount').focus(); return; }
  send({ a: 'add', k: kind, amount, category: ($('#custom').value.trim() || sel).slice(0, 50) });
});
$('#setlim').addEventListener('click', () => send({ a: 'budget', amount: digits($('#limit').value) }));
$('#hist').addEventListener('click', e => {
  const b = e.target.closest('.x'); if (!b) return;
  ask("Yozuv o'chirilsinmi?", () => send({ a: 'del', id: +b.dataset.id }));
});
$$('.tab').forEach(t => t.addEventListener('click', () => {
  $$('.tab').forEach(x => x.classList.toggle('on', x === t));
  ['add', 'stats', 'hist'].forEach(v => $('#v-' + v).hidden = v !== t.dataset.v);
}));
$('#theme').addEventListener('click', () => applyTheme(!document.documentElement.classList.contains('light')));

if (tg) { tg.ready(); tg.expand(); }
let light = false; try { light = localStorage.getItem('theme') === 'l'; } catch (e) {}
applyTheme(light);
const S = readStats();
renderChips(); renderStats(S); renderHist(S.h || []);
</script>
</body>
</html>
